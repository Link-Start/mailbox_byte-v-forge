syntax = "proto3";

package email;

option go_package = "./;pb";

message InboundEmailWebhook {
  int32 version = 1;
  string provider_key = 2;
  string event_id = 3;
  string message_id = 4;
  string from_address = 5;
  repeated string recipients = 6;
  string subject = 7;
  string text_body = 8;
  string html_body = 9;
  int64 received_at_unix = 10;
  int64 raw_size = 11;
  reserved 12, 13;
  reserved "extracted_otp", "event_type";
}
